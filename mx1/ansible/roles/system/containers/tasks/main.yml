---
- name: Ensure /opt/containers exists
  ansible.builtin.file:
    path: /opt/containers
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy containers directory to remote node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../containers/"
    dest: /opt/containers/
    owner: root
    group: root
    mode: "0755"
  notify: Restart containers

- name: Create shared app-infra Docker network
  community.docker.docker_network:
    name: app-infra
    enable_ipv6: "{{ (lookup('env', 'DOCKER_IPV6_SUBNET') | length > 0) | bool }}"
    ipam_config: "{{ [{'subnet': lookup('env', 'DOCKER_IPV6_SUBNET')}] if (lookup('env', 'DOCKER_IPV6_SUBNET') | length > 0) else omit }}"
    internal: false
    scope: "global"
    state: present

- name: Manage stalwart .env entries
  ansible.builtin.lineinfile:
    path: /opt/containers/stalwart/.env
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}={{ lookup("env", item.value) }}'
    create: true
    owner: root
    group: root
    mode: "0600"
  loop:
    - key: PG_PASS
      value: STALWART_PG_PASSWORD
    - key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: STALWART_OPENSEARCH_PASSWORD
  when: lookup('env', item.value) | length > 0

- name: Deploy docker-compose projects
  ansible.builtin.include_tasks: deploy_stack.yml
  loop: "{{ docker_stacks | dict2items }}"

- name: Clean up Docker system
  community.docker.docker_prune:
    containers: true
    images: true
    images_filters:
      dangling: false
    networks: true
    builder_cache: true

