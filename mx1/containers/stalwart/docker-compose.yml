---
services:
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-stalwart}
      POSTGRES_DB: ${PG_DB:-stalwart}
    env_file:
      - .env
    networks:
      - app-infra

  keydb:
    image: docker.io/eqalpha/keydb:x86_64_v0.9.6@sha256:3ba477d222fa893fc948dc9293f513483ab2d6fa5abb82d8d68485056faf1261
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ./keydb.conf:/etc/keydb/keydb.conf
      - keydb-data:/data
    networks:
      - app-infra

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: true
      OPENSEARCH_JAVA_OPTS: -Xms4g -Xmx8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    env_file:
      - .env
    networks:
      - app-infra

  stalwart:
    image: ghcr.io/thundersquared/stalwart:0.15.5@sha256:a930aca74de3fef2026a04fc2200ba5126d5712d9e52248e863d165acc338e4b
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:10025:25"
      - "127.0.0.1:10080:80"
      - "127.0.0.1:10110:110"
      - "127.0.0.1:10143:143"
      - "443:443"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - stalwart-data:/opt/stalwart
    depends_on:
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-infra

volumes:
  database:
    driver: local
  stalwart-data:
    driver: local
  keydb-data:
    driver: local
  opensearch-data:
    driver: local

networks:
  app-infra:
    external: true
