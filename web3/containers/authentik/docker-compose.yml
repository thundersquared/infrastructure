---
services:
  database:
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - authentik

  server:
    image: ghcr.io/thundersquared/authentik:2026.8.4@sha256:2b9064477e3bf60b8c7f7eb85ec7fb608b243125c18a964925fdd09e9b5eb280
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: server
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:9000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik
      - app-infra

  worker:
    image: ghcr.io/thundersquared/authentik:2026.8.4@sha256:2b9064477e3bf60b8c7f7eb85ec7fb608b243125c18a964925fdd09e9b5eb280
    restart: unless-stopped
    command: worker
    user: root
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik

volumes:
  database:
    driver: local

networks:
  authentik:
    driver: bridge
  app-infra:
    external: true
