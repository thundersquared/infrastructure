---
services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      # Node key and login. Losing it means re-registering with a new key.
      - ./state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    # NET_ADMIN: create tailscale0 and its routes. NET_RAW: tailscaled's
    # iptables/nftables rules fail with "Permission denied" without it.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
