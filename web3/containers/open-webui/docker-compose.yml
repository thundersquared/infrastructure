---
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3005:8080"
    volumes:
      - open_webui:/app/backend/data
    env_file:
      - .env
    networks:
      - app-infra

volumes:
  open_webui:
networks:
  app-infra:
    external: true
