---
services:
  gateway:
    # renovate: datasource=docker depName=nousresearch/hermes-agent
    image: nousresearch/hermes-agent:v2026.9.11@sha256:9469b3e78b9545b6d576eb8887a95352e9a0ea83730eaf31431cf862ca1010e1  # yamllint disable-line rule:line-length
    command: ["gateway", "run"]
    env_file:
      - .env
    volumes:
      - hermes_data:/opt/data
    networks:
      - app-infra
    ports:
      - "127.0.0.1:3008:9119"
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hermes_data:
    name: hermes_data

networks:
  app-infra:
    external: true
