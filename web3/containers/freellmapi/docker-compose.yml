---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.44@sha256:f45530dc84f419cbba9d5aea9fbfa9a5a6a823dca2c7d20c4c1961dff04124f7 # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
