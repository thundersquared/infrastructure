---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.42@sha256:40450606f6dba126362627d559a4c677a68c1d672850ce0c46329397dd90758a # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
