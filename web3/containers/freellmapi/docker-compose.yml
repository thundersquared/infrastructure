---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.39@sha256:23077d4d33ad9749971f326a38010aeb7d6aabc27ff3a248d4c6d9dfb3e0c8ff # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
