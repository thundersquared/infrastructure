---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.43@sha256:976899c920e6a2acca12ffe91172f967e8b110edfff22fc6a32757fa6e0e6a62 # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
