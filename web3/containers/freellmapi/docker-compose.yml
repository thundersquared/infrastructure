---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.34@sha256:3016d212818906b3002a0685e2575b8ecf2c76908cf9fdc0292b9617824881da # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
