---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.47@sha256:acdd56396b6f395fedc2ab803784572f8b98c3eabb26c0911d0e8131b882b7b2 # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
