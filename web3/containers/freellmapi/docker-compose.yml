---
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.45@sha256:679527e9fe8a13062277df7ec3b8fb3dbb4167a3f5e1da9c29468c65b32720b3 # yamllint disable-line rule:line-length
    restart: unless-stopped
    # Start as node directly: the image's entrypoint otherwise starts as root
    # and drops privileges with setpriv, which needs SETUID/SETGID.
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3009:3001"
    env_file:
      - .env
    volumes:
      - freellmapi-data:/app/server/data
    networks:
      - app-infra

volumes:
  freellmapi-data:

networks:
  app-infra:
    external: true
