---
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    env_file:
      - .postgres.env
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    networks:
      - litellm

  litellm:
    image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa  # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3007:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - providers-auth:/app/providers-auth
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - litellm
      - app-infra

  chatgpt-account-1:
    image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa  # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./chatgpt-worker-config.yaml:/app/chatgpt-worker-config.yaml:ro
      - chatgpt-account-1-tokens:/app/chatgpt-tokens
    environment:
      CHATGPT_TOKEN_DIR: /app/chatgpt-tokens
    command:
      - "--config=/app/chatgpt-worker-config.yaml"
      - "--port=4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - litellm

  chatgpt-account-2:
    image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa  # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./chatgpt-worker-config.yaml:/app/chatgpt-worker-config.yaml:ro
      - chatgpt-account-2-tokens:/app/chatgpt-tokens
    environment:
      CHATGPT_TOKEN_DIR: /app/chatgpt-tokens
    command:
      - "--config=/app/chatgpt-worker-config.yaml"
      - "--port=4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - litellm

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996  # yamllint disable-line rule:line-length
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3008:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - litellm

volumes:
  postgres:
  prometheus:
  providers-auth:
  chatgpt-account-1-tokens:
  chatgpt-account-2-tokens:

networks:
  litellm:
  app-infra:
    external: true
