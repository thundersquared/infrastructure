---
services:
  gpt-load:
    image: ghcr.io/tbphp/gpt-load:2.0.0-rc.60@sha256:1bf69ddbc43d65128c60753ba0230817b23aff6ebba392a37f320e776ee7192f # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3007:3000"
    env_file:
      - .env
    volumes:
      - gpt-load-data:/app/data
    stop_grace_period: "${CONTAINER_STOP_GRACE_PERIOD}"
    healthcheck:
      test: >-
        wget -q --spider -T 10 -O /dev/null http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-infra

volumes:
  gpt-load-data:
networks:
  app-infra:
    external: true
