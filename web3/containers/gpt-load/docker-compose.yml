---
services:
  gpt-load:
    image: ghcr.io/tbphp/gpt-load:2.0.0-rc.35@sha256:146d7630a3364dad1239a23d865de2e95fdeefa203c864a4ac91c2840797b821  # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3007:3000"
    env_file:
      - .env
    volumes:
      - gpt-load-data:/app/data
    stop_grace_period: "${CONTAINER_STOP_GRACE_PERIOD}"
    healthcheck:
      test: >-
        wget -q --spider -T 10 -O /dev/null http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-infra

volumes:
  gpt-load-data:

networks:
  app-infra:
    external: true
