---
services:
  gpt-load:
    image: ghcr.io/tbphp/gpt-load:2.0.0-rc.54@sha256:a423b8730c50a63a6e88b60867fd07bb984db3b9f10b8ea2001598d1ae113e02 # yamllint disable-line rule:line-length
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3007:3000"
    env_file:
      - .env
    volumes:
      - gpt-load-data:/app/data
    stop_grace_period: "${CONTAINER_STOP_GRACE_PERIOD}"
    healthcheck:
      test: >-
        wget -q --spider -T 10 -O /dev/null http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-infra

volumes:
  gpt-load-data:
networks:
  app-infra:
    external: true
