services:
  database:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    env_file: .env
    cap_add:
      - SYS_NICE
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fleet
    restart: unless-stopped

  kv:
    image: valkey/valkey:9-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    command: ["valkey-server", "--appendonly", "yes"]
    networks:
      - fleet
    restart: unless-stopped
    volumes:
      - kv:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  fleet-init:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    volumes:
      - logs:/logs
      - data:/fleet
      - vulndb:/vulndb
    command: sh -c "chown -R 100:101 /logs /fleet /vulndb"

  fleet:
    image: ghcr.io/thundersquared/fleet:4.90.1@sha256:195214cc4386587d5edc584647b276676b1e00a2dacd928da45fc5889830afcd
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
      kv:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    ports:
      - "127.0.0.1:3002:${FLEET_SERVER_PORT}"
    env_file: .env
    volumes:
      - logs:/logs
      - data:/fleet
      - vulndb:/vulndb
    networks:
      - app-infra
      - fleet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${FLEET_SERVER_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  database:
  logs:
  data:
  vulndb:
  kv:
networks:
  app-infra:
    external: true
  fleet:
    driver: bridge
