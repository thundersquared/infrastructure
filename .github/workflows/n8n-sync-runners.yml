---
# n8n's external task runners must run the same version as n8n. Renovate
# updates only the n8n image (renovate.json disables n8nio/runners), so this
# workflow pins n8nio/runners to the same tag on Renovate's n8n branch:
#
#   1. Renovate pushes renovate/n8n with a new n8n tag. Until this workflow
#      has run, ci/n8n-versions-check.sh fails the required yamllint check,
#      so neither a person nor Renovate's automerge can merge it.
#   2. This workflow runs ci/n8n-sync-runners.sh and pushes the result. Its
#      commits are listed in renovate.json's gitIgnoredAuthors, so Renovate
#      keeps managing the branch, and recreates the commit by triggering this
#      workflow again whenever it rebases.
#   3. It pushes with the N8N_SYNC_TOKEN secret, not GITHUB_TOKEN: a push made
#      with GITHUB_TOKEN starts no workflows, and a dispatched Validate run
#      cannot satisfy the pull request's required checks. With this token the
#      push runs Validate on pull_request as usual. It also runs this workflow
#      once more, which finds nothing to change.
#
# N8N_SYNC_TOKEN is a fine-grained personal access token (or a GitHub App
# installation token) limited to this repository, with Contents: read and
# write.
#
# When the runners tag is not on Docker Hub yet, the sync fails and the pull
# request stays blocked; rerun this workflow once the tag exists.

name: Sync n8n task runners

on:
  push:
    branches:
      - renovate/n8n
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-sync-runners-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Pin n8nio/runners to the n8n version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require N8N_SYNC_TOKEN
        env:
          N8N_SYNC_TOKEN: ${{ secrets.N8N_SYNC_TOKEN }}
        run: |
          if [ -z "$N8N_SYNC_TOKEN" ]; then
            echo "::error::The N8N_SYNC_TOKEN secret is not set; see the header of this workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.N8N_SYNC_TOKEN }}
          persist-credentials: true  # the commit step pushes with this token

      - name: Pin n8nio/runners
        run: ci/n8n-sync-runners.sh

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "n8nio/runners already matches n8n"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(deps): pin n8nio/runners to the n8n version"
          git push origin "HEAD:$BRANCH"
