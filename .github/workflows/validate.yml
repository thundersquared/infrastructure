---
# Static validation for pull requests.
#
# This workflow runs on `pull_request` and needs no credentials, so it is
# configured to hold none:
#
#   1. It references no `secrets.*` and no `environment:`, so the job runs with
#      no access to repository or environment secrets regardless of who opened
#      the pull request. zizmor's audits cover the mechanical cases; the rest
#      is review.
#   2. `permissions: contents: read` at workflow level — no write scopes and
#      no `id-token`.
#   3. Third-party actions are pinned to a full commit SHA, so the code that
#      runs with this job's token is fixed.
#   4. Every `actions/checkout` sets `persist-credentials: false`, keeping the
#      token out of `.git/config` where later steps could read it.
#
# If a check ever needs a secret, do not add it here. Put it in a separate
# workflow triggered on `push` to a protected branch.
#
# Only the checks a pull request can affect run. Every job starts its own
# runner however short it is, and most pull requests are Renovate image bumps,
# opened in bursts, that touch nothing but a host's containers/ directory. So
# the yamllint job, which always runs, also works out from the diff which
# other checks the change can affect, and each of those jobs waits for it and
# runs only if needed. A job skipped by its `if:` still reports success, so all
# of them can stay required status checks; a workflow-level `paths:` filter
# would leave them pending instead. Merge queue and manual runs check
# everything.
#
# The dependent jobs use `!cancelled()` so they still run when yamllint fails,
# and compare against 'false' rather than 'true' so that a missing output runs
# the check instead of skipping it: a skipped check counts as a pass.

name: Validate

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.changes.outputs.ansible }}
      tofu: ${{ steps.changes.outputs.tofu }}
      headscale: ${{ steps.changes.outputs.headscale }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      # Depth 2: on pull_request the checkout is GitHub's test merge commit,
      # and the diff below needs its first parent (the base branch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Each check's pathspecs list what it reads, except ansible-lint's,
      # which list what it may skip. When a check starts reading a new path,
      # add it here, or pull requests that change only that path will skip
      # the check and pass.
      - name: Detect which checks the change affects
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            for check in ansible tofu headscale workflows; do
              echo "$check=true"
            done | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          # The test merge commit's first parent is the base branch, so this
          # is exactly what merging the pull request would change.
          # --no-renames counts both sides of a move: a task file moved out of
          # ansible/ is still an ansible change. Pathspecs rather than a regex
          # over --name-only, which quotes paths with unusual characters.
          git diff --name-only --no-renames HEAD^1 HEAD --
          echo

          # touches PATHSPEC...: does the change touch any of these paths? A
          # git error (exit 128) counts as touched, so the check runs.
          touches() {
            if git diff --quiet --no-renames HEAD^1 HEAD -- "$@"; then
              echo false
            else
              echo true
            fi
          }

          {
            # ansible-lint reads nearly the whole tree, so it is skipped only
            # when every changed path is Markdown or under a host's Compose
            # stacks, OpenTofu tree or docs, three trees .ansible-lint
            # excludes. Keep these in step with those three entries, but
            # never add .github/: this job and its setup action live there.
            echo "ansible=$(touches . \
              ':(exclude,glob)*/containers/**' \
              ':(exclude,glob)*/terraform/**' \
              ':(exclude,glob)*/docs/**' \
              ':(exclude,glob)**/*.md')"
            # This workflow pins tofu_version.
            echo "tofu=$(touches tower/terraform .github/workflows/validate.yml)"
            # The config and policy, the compose file (it pins the image, so
            # Renovate bumps count), the script, and this workflow.
            echo "headscale=$(touches tower/containers/headscale \
              ci/headscale-check.sh .github/workflows/validate.yml)"
            # This workflow, the composite action it uses, and zizmor's
            # config (zizmor.yml or zizmor.yaml, at the root or in .github/).
            echo "workflows=$(touches .github zizmor.yml zizmor.yaml)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: $/.github/actions/setup-lint-env
        with:
          packages: yamllint==1.38.0

      - name: Lint YAML
        run: yamllint --strict --config-file .yamllint .

  ansible:
    name: ansible-lint
    needs: yamllint
    if: ${{ !cancelled() && needs.yamllint.outputs.ansible != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # requirements.txt first, then ansible-lint, so that ansible-lint runs
      # against the ansible-core the deploys pin rather than resolving its own.
      # If the two ever conflict, this fails here instead of quietly installing
      # a second copy and validating something deploys never run.
      - uses: $/.github/actions/setup-lint-env
        with:
          packages: -r requirements.txt ansible-lint==26.9.0

      - name: Cache galaxy requirements
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible
          key: ansible-galaxy-${{ hashFiles('*/ansible/requirements.yml') }}

      # `ansible-galaxy install` (not `collection install`) so roles are
      # fetched too — requirements.yml lists roles as well as collections, and
      # the geerlingguy.docker role is what pulls in community.docker /
      # community.general that the tasks actually call.
      #
      # No `--force`: it re-downloaded every item once per host (~6x) and
      # defeated the cache. Without it, galaxy skips what is already installed,
      # so hosts sharing the same pins cost nothing after the first. The cache
      # key has no restore-keys fallback, so a changed requirements.yml always
      # starts from an empty cache (roles are not re-fetched on version bump).
      #
      # Skipped on a cache hit. With no restore-keys every hit is exact, and
      # actions/cache saves only when the job succeeds, so a hit already holds
      # everything these files pin. Caches saved by a pull request are visible
      # only to that pull request, so this spares a PR's later pushes the
      # Galaxy round trips, not its first.
      #
      # These are resolved from the PR's requirements.yml, so a PR can point
      # that at an arbitrary source. The job holds no credentials, so the
      # exposure is limited to a throwaway runner.
      - name: Install collections and roles
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: |
          for host in mx1 web1 web2 web3 tower mirror; do
            if [ -f "$host/ansible/requirements.yml" ]; then
              ansible-galaxy install -r "$host/ansible/requirements.yml"
            fi
          done

      - name: Lint playbooks and roles
        run: ansible-lint --offline

  tofu:
    name: OpenTofu
    needs: yamllint
    if: ${{ !cancelled() && needs.yamllint.outputs.tofu != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tower/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: v1.13.1

      # -backend=false skips the S3 backend entirely, so validate needs no OCI
      # credentials and no state access.
      - name: Init without backend
        run: tofu init -backend=false -input=false -no-color

      - name: Validate
        run: tofu validate -no-color

      - name: Check formatting
        run: tofu fmt -check -recursive -diff

  headscale:
    name: Headscale config
    needs: yamllint
    if: ${{ !cancelled() && needs.yamllint.outputs.headscale != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the image pinned in tower/containers/headscale/docker-compose.yml
      # against the committed config and policy, so a Renovate bump that drops
      # a config key fails here rather than crash-looping on tower.
      #
      # The image reference comes from the PR, like the galaxy sources above.
      # The job holds no credentials and the container gets no network.
      - name: Check config and policy with the pinned image
        run: ci/headscale-check.sh

  workflows:
    name: Workflow lint
    needs: yamllint
    if: ${{ !cancelled() && needs.yamllint.outputs.workflows != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-lint-env
        with:
          packages: zizmor==1.30.1

      # Scoped to this workflow on purpose.
      #
      # This is the only workflow that runs code from a pull request, so it is
      # the one where an Actions-level flaw matters most. Auditing it keeps the
      # properties in the header comment from regressing.
      #
      # The deploy workflows are excluded because they legitimately hold
      # credentials: they need `secrets.*` to deploy, and two of them chain off
      # a provisioning job. Those are sound here because the triggering
      # workflow only runs on push-to-main, schedule and manual dispatch.
      # zizmor currently reports 42 findings across those eight files, mostly
      # `template-injection` on `secrets.*` interpolation and missing
      # `persist-credentials: false`. Worth a dedicated hardening pass; not
      # this PR.
      - name: Audit this workflow
        run: zizmor --persona=pedantic --min-severity=low .github/workflows/validate.yml
