---
services:
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:11.7.1@sha256:28540f81d2cffbd9d089c08438e39a7689a7cee7e9a5b0f60de93a22d19f5dbe
    container_name: cobalt-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    networks:
      - app-infra
    volumes:
      - ./keys.json:/app/keys.json:ro

networks:
  app-infra:
    external: true
