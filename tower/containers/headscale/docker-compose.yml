---
services:
  headscale:
    image: headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    command: serve
    restart: unless-stopped
    # HEADSCALE_SERVER_URL and HEADSCALE_TLS_LETSENCRYPT_HOSTNAME, written by
    # the system/headscale role so the hostname stays out of git.
    env_file:
      - .env
    # Host networking: this is the tailnet's public control plane + DERP relay
    # (443/tcp) and STUN endpoint (3478/udp), listening on [::] for IPv4 and
    # IPv6 with no Docker NAT in between. STUN must see each client's real
    # source address, which Docker's userland proxy hides for IPv6. Metrics
    # and gRPC stay on the host's loopback (config.yaml).
    network_mode: host
    volumes:
      # config.yaml + policy.hujson, committed next to this file.
      - ./config:/etc/headscale:ro
      # Keys, SQLite DB and ACME cache. Not in git; snapshotted by the
      # system/headscale role before every deploy.
      - /opt/containers/headscale/data:/var/lib/headscale
    # Headscale writes only to its data volume and the unix socket directory.
    read_only: true
    tmpfs:
      - /var/run/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
