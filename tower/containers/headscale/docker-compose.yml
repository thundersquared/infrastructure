services:
  headscale:
    image: headscale/headscale:v0.29.3@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    command: serve
    restart: unless-stopped
    ports:
      - "443:443/tcp"
      - "3478:3478/udp"
    volumes:
      - /opt/containers/headscale/data:/var/lib/headscale
      - /opt/containers/headscale/config.yaml:/etc/headscale/config.yaml:ro
    tmpfs:
      - /var/run/headscale
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - app-infra

networks:
  app-infra:
    external: true
