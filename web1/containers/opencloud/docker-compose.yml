---
services:
  garage:
    # yamllint disable-line rule:line-length
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    restart: "no"
    # Garage is a data store. It writes both persistent volumes as root.
    # It is exempt from the default capability drop.
    env_file:
      - garage.env
    volumes:
      - garage_meta:/var/lib/garage/meta
      - /mnt/opencloud/garage:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - garage

  opencloud:
    # yamllint disable-line rule:line-length
    image: opencloudeu/opencloud:9.1.1@sha256:d7d5b547f9e41db24f030d6a6857c4184752b2c875c936952ee0601b6531cd51
    user: "1000:1000"
    entrypoint:
      - /bin/sh
    command:
      - -c
      - opencloud init || true; opencloud server
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3006:9200"
    env_file:
      - .env
    depends_on:
      - garage
    volumes:
      - opencloud_config:/etc/opencloud
      - opencloud_data:/var/lib/opencloud
      - ./csp.yaml:/etc/opencloud/csp.yaml:ro
      - ./banned-password-list.txt:/etc/opencloud/banned-password-list.txt:ro
      - ./themes:/etc/opencloud/themes:ro
    networks:
      - app-infra
      - garage

volumes:
  garage_meta:
  opencloud_config:
  opencloud_data:
networks:
  app-infra:
    external: true
  garage:
    internal: true
