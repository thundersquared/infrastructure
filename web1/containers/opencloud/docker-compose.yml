---
services:
  garage:
    # yamllint disable-line rule:line-length
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    restart: "no"
    # Garage is a data store. It writes both persistent volumes as root.
    # It is exempt from the default capability drop.
    env_file:
      - garage.env
    volumes:
      - garage_meta:/var/lib/garage/meta
      - /mnt/opencloud/garage:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - garage

  opencloud:
    # yamllint disable-line rule:line-length
    image: opencloudeu/opencloud:7.2.4@sha256:6d992ccc5f1cbc7b2a9b272ba25f879b1b159c2d7ed7f5527e09059f16295697
    user: "1000:1000"
    entrypoint:
      - /bin/sh
    command:
      - -c
      - opencloud init || true; opencloud server
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3006:9200"
    env_file:
      - .env
    depends_on:
      - garage
    volumes:
      - opencloud_config:/etc/opencloud
      - opencloud_data:/var/lib/opencloud
      - ./csp.yaml:/etc/opencloud/csp.yaml:ro
      - ./banned-password-list.txt:/etc/opencloud/banned-password-list.txt:ro
      - ./themes:/etc/opencloud/themes:ro
    networks:
      - app-infra
      - garage

volumes:
  garage_meta:
  opencloud_config:
  opencloud_data:

networks:
  app-infra:
    external: true
  garage:
    internal: true
