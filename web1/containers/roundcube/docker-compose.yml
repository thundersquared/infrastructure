services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.3-apache@sha256:ca53d6118c8c3ae8f3570b4588f08e0579e0d98f1a632b5d316285002f64215b
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
