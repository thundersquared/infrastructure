---
services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.5-apache@sha256:9d19d988694b14770aab4899c31c61a2212df947c113a40915e13c026354e88b
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
