services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.4-apache@sha256:b5f02e7980c7279eac7b50abf7857d74e3ec956230ac34ea1b3ef4c31f29be82
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
