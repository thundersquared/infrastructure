services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.3-apache@sha256:412a79e70e783f9bb8a6e22a862be5e1a0164026bf00cc90f14fdc8f7cab97cc
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
