services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.3-apache@sha256:4df93533fd1a39223a326590261ecee0eaeaafe12e9af3000f0fa2869c033212
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
