---
services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.5-apache@sha256:dfe7e05eccab55cf3d0d508fade5046ca4c7cd1530070c803d670ec2b2933607
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
