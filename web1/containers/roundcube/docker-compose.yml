services:
  roundcubemail:
    image: roundcube/roundcubemail:1.7.2-apache@sha256:74aaebfae7a9aa63808af330f36dfce502a678752e725bc823507b90e6bc584c
    container_name: roundcubemail
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./www:/var/www/html
      - ./db/sqlite:/var/roundcube/db
    ports:
      - "127.0.0.1:3002:80"
    env_file:
      - .env
    networks:
      - app-infra

networks:
  app-infra:
    external: true
