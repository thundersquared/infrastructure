---
services:
  gateway:
    # renovate: datasource=docker depName=nousresearch/hermes-agent
    image: nousresearch/hermes-agent:v2026.9.14@sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294  # yamllint disable-line rule:line-length
    command: ["gateway", "run"]
    env_file:
      - .env
    volumes:
      - hermes_data:/opt/data
    networks:
      - app-infra
    ports:
      - "127.0.0.1:3007:9119"
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  hermes_data:
    name: hermes_data

networks:
  app-infra:
    external: true
