---
services:
  database:
    image: postgres:18.7-alpine3.23@sha256:60aac580d8dbe3093c097bb1d11f9e62999814d3a1da2c1aaf729c0b7db117f2
    restart: unless-stopped
    environment:
      # PG18: version-specific PGDATA; volume mounts at /var/lib/postgresql
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - database:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calcom

  calcom:
    image: calcom/cal.com:v6.2.0@sha256:ace3bb1219fb7306585ab9f4d94d41af7ee064c343db0498173436bbe857bd49
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env
    networks:
      - calcom
      - app-infra

volumes:
  database:
    driver: local

networks:
  calcom:
    driver: bridge
  app-infra:
    external: true
