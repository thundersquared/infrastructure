---
services:
  database:
    image: postgres:19.0-alpine3.23@sha256:8b9e23fd0652e6857367455c41fd6624823995fa120a2f912222d29203ab1b6a
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      # PG18: version-specific PGDATA; volume mounts at /var/lib/postgresql
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - authentik

  server:
    image: ghcr.io/thundersquared/authentik:2026.8.6@sha256:4d8a637af5e6192ec6feaaea68c4f9ef842b0a8be8a518090a7b7dc892eaaa29
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: server
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik
      - app-infra

  worker:
    image: ghcr.io/thundersquared/authentik:2026.8.6@sha256:4d8a637af5e6192ec6feaaea68c4f9ef842b0a8be8a518090a7b7dc892eaaa29
    restart: unless-stopped
    command: worker
    user: root
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik

volumes:
  postgres:
    driver: local

networks:
  authentik:
    driver: bridge
  app-infra:
    external: true
