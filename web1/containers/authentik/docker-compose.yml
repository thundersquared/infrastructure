---
services:
  database:
    image: postgres:18.7-alpine3.23@sha256:60aac580d8dbe3093c097bb1d11f9e62999814d3a1da2c1aaf729c0b7db117f2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      # PG18: version-specific PGDATA; volume mounts at /var/lib/postgresql
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - authentik

  server:
    image: ghcr.io/thundersquared/authentik:2026.8.5@sha256:cf8b2a8d8a6b30f9784487aa7f2466374ab2b396eced43d7ab5e34a70e907c42
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: server
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik
      - app-infra

  worker:
    image: ghcr.io/thundersquared/authentik:2026.8.5@sha256:cf8b2a8d8a6b30f9784487aa7f2466374ab2b396eced43d7ab5e34a70e907c42
    restart: unless-stopped
    command: worker
    user: root
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - authentik

volumes:
  postgres:
    driver: local

networks:
  authentik:
    driver: bridge
  app-infra:
    external: true
