---
- name: Ensure PHP FPM services are stopped and disabled
  ansible.builtin.systemd_service:
    name: "php{{ item }}-fpm"
    state: stopped
    enabled: false
  loop:
    - "7.1"
    - "7.2"
    - "7.3"
    - "7.4"
    - "8.0"
    - "8.1"
    - "8.2"
    - "8.3"

- name: Ensure PHP FPM pool configuration files have read permissions
  ansible.builtin.file:
    path: "/etc/php/{{ item }}/fpm/pool.d"
    mode: "a+r"
    recurse: true
  loop:
    - "7.1"
    - "7.2"
    - "7.3"
    - "7.4"
    - "8.0"
    - "8.1"
    - "8.2"
    - "8.3"
    - "8.4"
  failed_when: false
  no_log: true

- name: Build PECL extensions for installed PHP versions
  ansible.builtin.include_tasks: build_extensions.yml
