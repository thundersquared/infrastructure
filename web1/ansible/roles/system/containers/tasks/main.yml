---
- name: Ensure /opt/containers exists
  ansible.builtin.file:
    path: /opt/containers
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy OpenCloud Compose project to remote node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../containers/opencloud/"
    dest: /opt/containers/opencloud/
    owner: root
    group: root
    mode: "0755"
  notify: Restart OpenCloud

- name: Copy containers directory to remote node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../containers/"
    dest: /opt/containers/
    owner: root
    group: root
    mode: "0755"

- name: Create shared app-infra Docker network
  community.docker.docker_network:
    name: app-infra
    enable_ipv6: >-
      {{ (lookup('env', 'DOCKER_IPV6_SUBNET') | length > 0) | bool }}
    ipam_config: >-
      {{ [{'subnet': lookup('env', 'DOCKER_IPV6_SUBNET')}] if
         (lookup('env', 'DOCKER_IPV6_SUBNET') | length > 0) else omit }}
    internal: false
    scope: "global"
    state: present

- name: Ensure webmail env.file exists
  ansible.builtin.copy:
    content: ""
    dest: /opt/containers/webmail/env.file
    force: false
    mode: "0644"

- name: Ensure roundcube .env exists
  ansible.builtin.copy:
    content: ""
    dest: /opt/containers/roundcube/.env
    force: false
    mode: "0644"

- name: Setup Authentik Infrastructure
  ansible.builtin.include_tasks: authentik.yml

- name: Deploy docker-compose projects
  ansible.builtin.include_tasks: deploy_stack.yml
  loop: "{{ docker_stacks | dict2items }}"

- name: Configure OpenCloud Storage Box and systemd services
  ansible.builtin.include_tasks: opencloud.yml

- name: Clean up Docker system
  community.docker.docker_prune:
    containers: true
    images: true
    images_filters:
      dangling: false
    networks: true
    builder_cache: true
